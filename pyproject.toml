[project]
name = "lerobot-studio"
version = "0.1.0"
description = "Desktop dataset browser and editor for LeRobot datasets"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "PySide6>=6.8",
  "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-qt>=4.4",
]

[project.scripts]
lerobot-studio = "lerobot_studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

